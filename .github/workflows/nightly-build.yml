name: Nightly Build

on:
    push:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions: {}

jobs:
    build:
        name: Nightly Build
        runs-on: ubuntu-latest

        # Only to move the `nightly` tag. Pages deployment needs different
        # permissions and gets them on the job that actually deploys.
        permissions:
            contents: write

        outputs:
            deployable: ${{ steps.artifact.outputs.uploaded }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Get current tag for HEAD
              run: |
                  echo "CURRENT_TAG=$(git tag --points-at HEAD)" >> $GITHUB_ENV

            # github-token: '' — see plugin-check.yml for why the token
            # setup-php would otherwise write must not be there.
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              with:
                  php-version: latest
                  coverage: none
                  tools: wp-cli
                  github-token: ''

            - name: Clone GitHub over HTTPS
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: git config --global url."https://github.com/".insteadOf "git@github.com:"

            - name: Install compatible version of dist-archive-command
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: wp package install wp-cli/dist-archive-command:3.1.0

            - name: Setup Node
              uses: actions/setup-node@v7
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Install dependencies
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: npm ci

            - name: Build plugin
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: npm run build

            - name: Update version number
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: |
                  CURRENT_DATE=$(date +%Y.%-m.%-d)
                  sed -i -e "s/Version:.*/Version:           0.1.$CURRENT_DATE-${GITHUB_SHA::7}/g" ./a2ui-wp.php

            - name: Create updates information
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: |
                  CURRENT_DATE=$(date +%Y.%m.%d)
                  UPDATE=$(cat <<-END
                    {
                        "id": "https://swissspidy.github.io/a2ui-wp/update.json",
                        "slug": "a2ui-wp",
                        "version": "0.1.$CURRENT_DATE-${GITHUB_SHA::7}",
                        "url": "https://github.com/swissspidy/a2ui-wp",
                        "package": "https://swissspidy.github.io/a2ui-wp/nightly.zip",
                        "tested": "6.8",
                        "requires_php": "8.0",
                        "autoupdate": true
                    }
                  END

                  )

                  echo $UPDATE > update.json

            - name: Create ZIP file
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: wp dist-archive . ./a2ui-wp.zip

            - name: Prepare GitHub Pages
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: |
                  mkdir -p _site
                  mv update.json _site/update.json
                  cp ./a2ui-wp.zip _site/nightly.zip

            - name: Upload artifact
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              uses: actions/upload-pages-artifact@v5

            - name: Record that there is something to deploy
              id: artifact
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: echo "uploaded=true" >> "$GITHUB_OUTPUT"

            - name: Tag current commit
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: |
                  git config --local user.email "swissspidy@users.noreply.github.com"
                  git config --local user.name "swissspidy-bot"
                  git push origin :refs/tags/nightly
                  git tag -f nightly
                  git push origin --tags

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build

        # Nothing was built when HEAD already carries the nightly tag, and
        # deploy-pages fails outright when there is no artifact to deploy.
        if: ${{ needs.build.outputs.deployable == 'true' }}

        permissions:
            pages: write
            id-token: write

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
